[project]
name = "deep-learning-notes"
version = "2026.08.24"
keywords = [
    "deep learning tutorial",
    "computer vision",
    "natural language processing",
    "large language model",
    "pytorch",
    "quarto",
    "jupyter notebook",
    "typst",
]
description = "A collection of notes and code examples for deep learning concepts and techniques."
authors = [{ name = "jshn9515", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # PyTorch ecosystem
    "torch>=2.14.0,<2.15.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchvision>=0.29.0,<0.30.0",
    "torchinfo>=1.8.0,<1.9.0",
    "torchmetrics>=1.9.0,<1.10.0",

    # Hugging Face ecosystem
    "accelerate>=1.14.0,<1.15.0",
    "datasets>=5.0.0,<5.1.0",
    "diffusers>=0.40.0,<0.41.0",
    "evaluate>=0.4.0,<0.5.0",
    "kernels>=0.16.0,<0.17.0",
    "tokenizers>=0.23.0,<0.24.0",
    "transformers>=5.16.0,<5.17.0",

    # Scientific computing and machine learning
    "numpy>=2.5.0,<2.6.0",
    "scipy>=1.18.0,<1.19.0",
    "scikit-learn>=1.9.0,<1.10.0",
    "opt-einsum>=3.4.0,<3.5.0",

    # Data processing and visualization
    "pandas>=3.0.0,<3.1.0",
    "matplotlib>=3.11.0,<3.12.0",
    "pillow>=12.3.0,<12.4.0",

    # Jupyter and interactive development
    "ipython>=9.15.0",
    "ipywidgets>=8.0.0",
    "jupyter-cache>=1.0.0",
    "jupyterlab>=4.5.0",

    # Experiment tracking and utilities
    "wandb>=0.29.0,<0.30.0",
    "gdown>=6.2.0,<6.3.0",
    "pyyaml>=6.0.0,<6.1.0",
    "rich-click>=1.9.0,<1.10.0",

    # DNNL utilities
    "dnnlpy==2026.08.24",
]

[project.urls]
Homepage = "https://github.com/jshn9515/deep-learning-notes"

[dependency-groups]
cpu = [
    "torch>=2.14.0,<2.15.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchvision>=0.29.0,<0.30.0",
]

[tool.uv]
torch-backend = "cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
dnnlpy = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["dnnlpy"]
