[project]
name = "dnnlpy"
version = "2026.07.21"
keywords = ["deep learning notes", "library", "utilities"]
description = "A utility library for deep learning notes, providing common functions and tools to support the main content of the deep learning notes collection."
authors = [{ name = "Yunjie Lin", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    'matplotlib>=3.11.0,<3.12.0',
    'numpy>=2.5.0,<2.6.0',
    'psutil>=7.2.0,<7.3.0',
    'regex>=2026.7.10,<2026.8.0',
    'torch>=2.12.0,<2.13.0',
    'torchmetrics>=1.9.0,<1.10.0',
]

[project.optional-dependencies]
notebook = ['ipython>=9.10.0']
test = [
    'datasets>=5.0.0,<5.1.0',
    'pytest>=9.1.0,<9.2.0',
    'tokenizers>=0.23.1,<0.24.0', # keep sync with Transformers
]

[project.urls]
Homepage = "https://github.com/jshn9515/deep-learning-notes"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
